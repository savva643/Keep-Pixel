name: keep_pixel
description: "Keep Pixel — игры и приложения с аккаунтом Necsoura."
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: ^3.5.1

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.2
  web: ^1.1.1
  http: ^1.2.2
  flutter_secure_storage: ^9.2.4
  pointycastle: ^3.9.1
  crypto: ^3.0.6
  url_launcher: ^6.3.1
  cupertino_icons: ^1.0.8
  bitsdojo_window: ^0.1.6
  path: ^1.9.0
  path_provider: ^2.1.2
  dio: ^5.8.0+1
  archive: ^4.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/translations/
    - assets/fonts/Montserrat_LICENSE.txt
    - assets/fonts/Unbounded_LICENSE.txt
    - assets/fonts/Roboto_LICENSE.txt
    - assets/fonts/NotoSans_LICENSE.txt
  fonts:
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded.ttf
          weight: 700
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Montserrat-Light.ttf
          weight: 300
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Montserrat-Black.ttf
          weight: 900
