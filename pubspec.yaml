name: keep_pixel
description: "Keep Pixel — игры и приложения с аккаунтом Necsoura."
publish_to: 'none'
version: 1.3.0+4

environment:
  sdk: ^3.5.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.2
  web: ^1.1.1
  http: ^1.2.2
  flutter_secure_storage: ^9.2.4
  pointycastle: ^3.9.1
  crypto: ^3.0.6
  url_launcher: ^6.3.1
  cupertino_icons: ^1.0.8
  bitsdojo_window: ^0.1.6
  path: ^1.9.0
  path_provider: ^2.1.2
  dio: ^5.8.0+1
  archive: ^4.0.7
  # Shared Necsoura account module (lib/necsoura), same versions as blast! and Kompot
  cached_network_image: ^3.4.1
  cryptography: ^2.7.0
  easy_localization: ^3.0.5
  file_picker: ^10.3.3
  flutter_svg: ^2.0.10+1
  flutter_web_auth_2: ^5.1.0
  google_sign_in: ^7.2.0
  mobile_scanner: ^6.0.7
  qr_flutter: ^4.1.0
  sign_in_with_apple: ^8.2.0
  desktop_multi_window: ^0.3.1
  tray_manager: ^0.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/translations/
    - assets/fonts/Montserrat_LICENSE.txt
    - assets/fonts/Unbounded_LICENSE.txt
    - assets/fonts/NotoSans_LICENSE.txt
  fonts:
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded.ttf
          weight: 700
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Montserrat-Light.ttf
          weight: 300
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Montserrat-Black.ttf
          weight: 900
