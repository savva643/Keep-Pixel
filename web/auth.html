<!DOCTYPE html>
<!-- Страница возврата после входа через VK / Яндекс / Google в веб-версии (lib/necsoura/necsoura_social.dart):
     передаёт адрес с кодом входа окну приложения, которое её открыло, и закрывается -->
<html lang="ru">
<head><meta charset="utf-8"><title>Вход Necsoura</title></head>
<body style="background:#0e0e12;color:#f2f2f5;font:16px system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0">
<p>Вход выполнен — это окно закроется само.</p>
<script>
  (function () {
    var message = { 'flutter-web-auth-2': window.location.href };
    if (window.opener) {
      window.opener.postMessage(message, window.location.origin);
      window.close();
    } else if (window.parent && window.parent !== window) {
      window.parent.postMessage(message, window.location.origin);
    } else {
      localStorage.setItem('flutter-web-auth-2', window.location.href);
      window.close();
    }
  })();
</script>
</body>
</html>
